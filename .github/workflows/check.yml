# Every PR, and every push to main:
#  - docs/ must be exactly what _build/ produces (Pages serves docs/ as committed),
#  - every internal link and asset must resolve,
#  - Google Analytics must not load before consent.
# On PRs the built site and full-page screenshots of the blog are uploaded as the
# "preview" artifact, since GitHub Pages has no per-PR previews.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt

      - name: Committed site matches the sources
        run: |
          python3 _build/build.py
          git add --intent-to-add docs
          if ! git diff --quiet docs; then
            git diff --stat docs
            echo "::error::docs/ is not what _build/ produces. Run 'npm run build' and commit the result, or comment '@claude rebuild' on the PR."
            exit 1
          fi

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: Links, consent and blog screenshots
        run: |
          python3 -m http.server 8081 -d docs >/dev/null 2>&1 &
          sleep 1
          node _design/tools/linkcheck.mjs
          node _design/tools/test-consent.mjs
          node _design/tools/blog-shots.mjs

      - uses: actions/upload-artifact@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          name: preview
          path: |
            docs/
            _design/screens/blog-*.png
          if-no-files-found: ignore
          retention-days: 14
