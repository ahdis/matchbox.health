# The blog agent. What it does is in .claude/skills/matchbox-blog/SKILL.md.
#
#  first-pass  A PR that adds or changes a post is opened, or marked ready for
#              review: Claude turns the draft into the post, builds the site,
#              commits to the PR branch and comments what it did.
#  iterate     Any PR comment, review or review comment containing @claude.
#
# Only users with write access can trigger either job, and bot actors are
# rejected, so Claude's own pushes and comments never start it again.
# Auth: a Claude subscription token (`claude setup-token`) in the repository
# secret CLAUDE_CODE_OAUTH_TOKEN. The action swaps checkout's GITHUB_TOKEN for
# the Claude GitHub App's token before Claude runs, so its pushes trigger
# check.yml (pushes made with GITHUB_TOKEN would not).
#
# The action only gets the Claude App token when this file is identical to the
# copy on main, so a change to it takes effect once it is merged.
name: Claude

on:
  pull_request:
    types: [opened, ready_for_review]
    paths: ['_build/posts/**', '!_build/posts/_template.md']
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

env:
  CLAUDE_ARGS: >-
    --model claude-opus-5-5
    --max-turns 60
    --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,Bash(python3 _build/build.py),Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"

jobs:
  first-pass:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: anthropics/claude-code-action@v1.0.239
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /matchbox-blog ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: ${{ env.CLAUDE_ARGS }}

  iterate:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: anthropics/claude-code-action@v1.0.239
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: ${{ env.CLAUDE_ARGS }}
