<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found &mdash; matchbox.health</title>
<meta name="description" content="The page you asked for is not on www.matchbox.health.">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<style>
@font-face { font-family: Poppins; font-weight: 400; font-display: swap;
  src: url(/assets/fonts/poppins-400-latin.woff2) format("woff2"); }
@font-face { font-family: Poppins; font-weight: 500; font-display: swap;
  src: url(/assets/fonts/poppins-500-latin.woff2) format("woff2"); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: flex; align-items: center;
  justify-content: center; padding: 6vmax 6vw; text-align: center;
  background: #3d5c73; color: #fff;
  font-family: Poppins, "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: calc(16px + 0.12 * 1vmax); line-height: 1.5; }
main { max-width: 34em; }
h1 { margin: 0 0 0.5em; font-weight: 500; line-height: 1.316;
  font-size: calc(16px + 1.8 * 1vmax); }
p { margin: 0 0 32px; }
a.button { display: inline-block; text-decoration: none; font-weight: 500;
  background: #61a2ab; color: #fff; padding: 14.4px 24.048px;
  border-radius: 6.4px; font-size: 16px; letter-spacing: 0.02em; }
a.button:hover { opacity: 0.85; }
@media (min-width: 768px) {
  body { font-size: calc(16px + 0.12 * 1vw); padding: 6vmax 5vw; }
  h1 { font-size: calc(16px + 1.8 * 1vw); }
}
</style>
</head>
<body class="notfound-page">
<main>
  <h1>Page not found</h1>
  <p>The page you asked for is not here. It may have moved when this site was
     rebuilt.</p>
  <p><a class="button" id="home" href="/">Back to Overview</a></p>
</main>
<script>
// On the custom domain the root-absolute href above is already right. On the
// ahdis.github.io preview the site lives under /<repo>/, so point at that
// instead -- without this the only link on the page leaves the project.
(function () {
  if (!location.hostname.endsWith("github.io")) return;
  var repo = location.pathname.split("/")[1];
  if (repo) document.getElementById("home").href = "/" + repo + "/";
}());
</script>
</body>
</html>
